on:
  workflow_call:
    inputs:
      deploy-env:
        required: true
        description: 'Environment to deploy to'
        type: string
      deploy-branch:
        required: true
        description: 'Branch to deploy'
        type: string
      version:
        description: 'The version number to use for the build'
        required: true
        type: string
      package-name:
        description: 'The name of the package to push'
        required: true
        type: string
  
jobs:
  push-package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env }}
    steps:
      - name: Download Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package-name }}
          path: ./src/${{ inputs.package-name }}/bin/Release
      - name: Setup .NET Core
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Publish Package
        if: ${{ inputs.deploy-env == 'github-beta' }}
        run: |
          dotnet nuget add source --username baynezy --password ${{ secrets.NUGET_API_KEY }} --store-password-in-clear-text --name github ${{ vars.NUGET_SOURCE }}
      - name: Push package
        run: |
          source="${{ vars.NUGET_SOURCE }}"
          
          if [ "${{ inputs.deploy-env }}" == "github-beta" ]; then
              source="github"
          fi
          
          dotnet nuget push $(find ./src/${{ inputs.package-name }}/bin/Release/*.nupkg) --api-key ${{ secrets.NUGET_API_KEY }} --source ${source}